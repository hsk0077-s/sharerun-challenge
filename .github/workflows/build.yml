name: Flutter Build

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 코드 가져오기
        uses: actions/checkout@v3

      - name: 2. 자바(Java) 세팅
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. 플러터(Flutter) 세팅
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. 패키지 다운로드
        run: flutter pub get

      - name: 5. APK 앱 파일 만들기
        run: flutter build apk --release

      - name: 6. 완성된 APK 저장하기
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk