name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/jena_ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/jena_ai/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -q

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        # 화면 그림(골든)은 윈도우에서 만든 것이라 리눅스 CI에서는 어긋나서 건너뛴다.
        # 결과는 파일로 받아 두고, 실패하면 다음 단계에서 실패한 테스트만 보여 준다
        # (로그가 길어 실패가 잘려도 이름과 이유가 끝에 남는다).
        run: flutter test --exclude-tags golden --reporter json > test-results.jsonl

      - name: Show failed tests
        if: failure()
        run: python3 .github/scripts/show_failed_tests.py test-results.jsonl
