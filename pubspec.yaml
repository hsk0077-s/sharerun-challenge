name: share_run_challenge
description: Share Run Challenge commercial Flutter app.
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: any
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  firebase_messaging: any
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  geolocator: any
  go_router: any
  google_maps_flutter: any
  google_sign_in: ^7.2.0
  health: ^13.3.1
  http: any
  permission_handler: ^12.0.0
  url_launcher: any
  flutter_dotenv: any
  sensors_plus: any
  pedometer: ^4.1.1
  flutter_foreground_task: ^9.1.0
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  sign_in_with_apple: any
  shared_preferences: any
  webview_flutter: any
  image_picker: any
  in_app_purchase: any
  flutter_naver_login: ^2.1.1
  kakao_flutter_sdk_user: ^2.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/src_logo.jpeg
    - assets/images/src_logo_mark.png
    - assets/images/tiers/
    - assets/images/characters/